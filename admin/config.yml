      name: masas_bolones
      widget: list
      fields:
      - label: Nombre
        name: name
        widget: object
        fields:
        - label: Español
          name: es
          widget: string
        - label: Inglés
          name: en
          widget: string
      - label: Descripción
        name: desc
        widget: object
        fields:
        - label: Español
          name: es
          widget: string
        - label: Inglés
          name: en
          widget: string
      - label: Nota
        name: footer
        widget: object
        fields:
        - label: Español
          name: es
          widget: string
        - label: Inglés
          name: en
          widget: string
      - label: Foto
        name: image
        widget: image
        required: false
      summary: '{{fields.name.es}}'
    - label: Precios Bolón (entero / media)
      name: precios_bolones
      widget: list
      fields:
      - label: Nombre
