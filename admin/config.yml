backend:
  name: github
  repo: TU-USUARIO-GITHUB/monobolon-menu
  branch: main
  base_url: PEGAR_AQUI_LO_QUE_TE_DA_DECAPBRIDGE
media_folder: images/uploads
public_folder: /images/uploads
locale: es
collections:
- name: menu
  label: Menú MonoBolón
