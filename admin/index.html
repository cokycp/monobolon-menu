<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MonoBolón · Editor de carta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a08;--panel:#151713;--panel2:#1d201b;--line:#2c302a;--gold:#d4af62;--gold2:#e8c67a;--green:#3f6b47;--green2:#5fa06c;--white:#f0ede0;--gray:#9a9a8b;--red:#d0604f;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--white);font:16px/1.4 'Barlow',system-ui,sans-serif;min-height:100vh;padding-bottom:110px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,.cond{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line);transition:.15s;text-decoration:none;color:var(--white)}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405;border-color:transparent}
.btn.green{background:var(--green);border-color:transparent}
.btn.danger{color:var(--red);border-color:#4a2a25}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.ibtn{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;background:var(--panel2);border:1px solid var(--line);color:var(--gray)}
.ibtn:hover{color:var(--white);border-color:var(--gold)}
.ibtn.on{color:var(--gold)}
.ibtn.danger:hover{color:var(--red);border-color:var(--red)}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(rgba(8,10,7,.84),rgba(6,8,5,.94)),url('../images/backgrounds/hojas-verdes.jpg') center/cover}
.lcard{width:min(360px,100%);text-align:center}
.lcard img{width:150px;margin:0 auto 14px}
.lcard h1{font-size:30px;font-weight:800;color:var(--gold)}
.lcard p{color:var(--gray);margin:4px 0 22px}
.dots{display:flex;gap:14px;justify-content:center;height:22px;margin-bottom:8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);transition:.12s}
.dots i.f{background:var(--gold);transform:scale(1.1)}
.lerr{color:var(--red);min-height:24px;font-weight:600;margin-bottom:10px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:64px;border-radius:50%;width:64px;margin:auto;font:700 26px 'Barlow Condensed';background:rgba(255,255,255,.06);border:1px solid var(--line)}
.pad button:active{background:var(--gold);color:#111}
.pad .go{background:var(--green);border-color:transparent;font-size:18px}
.pad .go[disabled]{opacity:.35}

/* ---------- barra superior ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(10,10,8,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hrow{max-width:1100px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.hrow img{height:36px}
.hrow h1{font-size:22px;font-weight:700;flex:1;white-space:nowrap}
.role{font:600 12px 'Barlow';letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid var(--gold);color:var(--gold)}
.role.staff{border-color:var(--green2);color:var(--green2)}
@media(max-width:560px){.hrow h1{display:none}.hrow{justify-content:space-between}.hide-sm{display:none}}
.tabs{max-width:1100px;margin:auto;display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;position:relative;padding:10px 18px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font:700 17px 'Barlow Condensed';letter-spacing:.03em;white-space:nowrap}
.tab.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.tab .dot{position:absolute;top:4px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--green2);border:2px solid var(--bg)}

/* ---------- contenido ---------- */
main{max-width:1100px;margin:auto;padding:18px 16px}
.banner{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--green2);border-radius:var(--r);padding:12px 14px;margin-bottom:18px;color:var(--gray);font-size:15px}
.banner b{color:var(--white)}
.sec{margin-bottom:34px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-head h2{font-size:26px;font-weight:800;color:var(--gold)}
.sec-head .count{color:var(--gray);font-size:14px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:.15s}
.tile:hover{border-color:var(--gold);transform:translateY(-2px)}
.tile.changed,.row.changed,.hero.changed{border-color:var(--green2);box-shadow:0 0 0 1px var(--green2) inset}
.tile.isnew,.row.isnew{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.tile .ph{aspect-ratio:4/3;background:#0e100d;position:relative}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph .noimg{position:absolute;inset:0;display:grid;place-items:center;align-content:center;color:var(--gray);gap:6px;text-align:center;font-size:13px}
.tile .tb{padding:10px 12px 6px;flex:1}
.tile .tt{font:800 19px/1.1 'Barlow Condensed';letter-spacing:.02em;text-transform:uppercase}
.tile .pp{color:var(--gold);font-weight:600;margin-top:4px;font-size:15px}
.tile .ta{display:flex;gap:6px;padding:8px 10px 10px}
.tile .ta .ibtn{width:36px;height:36px}
.tile .ta .sp{flex:1}
.tile.off .ph img{filter:grayscale(1) brightness(.5)}
.tile.off .tt{color:var(--gray);text-decoration:line-through}
.badge{position:absolute;top:8px;left:8px;padding:3px 9px;border-radius:99px;font:700 12px 'Barlow';letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.75);border:1px solid var(--line)}
.badge.off{color:var(--red);border-color:var(--red)}
.addtile{border:2px dashed var(--line);background:transparent;min-height:150px;display:grid;place-items:center;align-content:center;color:var(--gray);border-radius:var(--r);font-weight:600;gap:6px;text-align:center;padding:14px}
.addtile:hover{border-color:var(--gold);color:var(--gold)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row .nm{min-width:0;cursor:pointer}
.row .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--gray);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pr{display:flex;gap:8px;align-items:center}
.row .ac{display:flex;gap:6px;align-items:center}
.row.off .nm b{color:var(--gray);text-decoration:line-through}
.row.off{opacity:.65}
.price{display:flex;align-items:center;background:#0e100d;border:1px solid var(--line);border-radius:10px;height:40px;padding:0 10px;gap:2px;min-width:0}
.price:focus-within{border-color:var(--gold)}
.price span{color:var(--gold);font-weight:700}
.price input{background:none;border:0;outline:0;width:68px;font-weight:600;font-size:17px;text-align:left}
.price.txt input{width:110px;font-size:15px}
.price small{color:var(--gray);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
@media(max-width:700px){.row{grid-template-columns:auto 1fr}.row .pr{grid-column:1/-1}.row .ac{grid-column:1/-1;justify-content:flex-end}}
.group{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px}
.group h3{font-size:22px;font-weight:800;margin-bottom:10px}
.sub-head{display:flex;align-items:center;gap:10px;margin:10px 0 8px}
.sub-head h4{font:700 15px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;color:var(--gray);flex:1}
.hero{display:grid;grid-template-columns:minmax(140px,260px) 1fr;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.hero img{width:100%;border-radius:10px;aspect-ratio:4/3;object-fit:cover;background:#0e100d}
.hero p{color:var(--gray);margin-bottom:10px}
@media(max-width:520px){.hero{grid-template-columns:1fr}}

/* ---------- barra de publicar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,16,13,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:1100px;margin:auto;display:flex;gap:10px;align-items:center}
.bar .st{flex:1;color:var(--gray);font-size:15px}
.bar .st b{color:var(--gold2)}
.bar .st.clean b{color:var(--green2)}
@media(max-width:560px){.bar .st{font-size:13px}.bar .btn{padding:0 12px}}

/* ---------- hoja de edición ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center}}
.sheet{width:min(640px,100%);max-height:94vh;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease}
@media(min-width:700px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet .sh h3{flex:1;font-size:24px;font-weight:800}
.sheet .sb{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.sheet .sf{display:flex;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet .sf .sp{flex:1}
.fld>label,.fld>.lb{display:block;font:700 14px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;color:var(--gray);margin-bottom:6px}
.fld .hint{color:var(--gray);font-size:13px;margin-top:4px}
.inp{width:100%;background:#0e100d;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:0;font-size:16px}
.inp:focus{border-color:var(--gold)}
.inp[disabled],.inp[readonly]{opacity:.55}
textarea.inp{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.two .tag{font:700 12px 'Barlow';letter-spacing:.08em;color:var(--gold);margin-bottom:4px;display:flex;justify-content:space-between}
.two .tag a{color:var(--gray);font-weight:500;letter-spacing:0;text-decoration:underline;cursor:pointer}
.lock{color:var(--gray);font-size:13px;display:flex;gap:6px;align-items:center;margin-top:6px}
.pic{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.pic .pv{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#0e100d;border:2px dashed var(--line);display:grid;place-items:center;color:var(--gray);text-align:center;font-size:13px;position:relative;padding:6px}
.pic .pv img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pic .pv.drag{border-color:var(--gold)}
.pic .pb{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.spin{position:absolute;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;font-weight:600;color:var(--white)}
@media(max-width:520px){.pic{grid-template-columns:110px 1fr}}
.sw{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.sw .tg{width:46px;height:26px;border-radius:99px;background:#3a3d36;position:relative;flex:none;transition:.15s}
.sw .tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on .tg{background:var(--red)}
.sw.on .tg::after{left:23px}
.sw small{color:var(--gray);display:block}
.mini{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
@media(max-width:520px){.mini{grid-template-columns:1fr auto}.mini .inp.en{grid-column:1/2}}
.hist{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:8px}
.hist div{flex:1}.hist small{color:var(--gray);display:block}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);z-index:90;background:#222;border:1px solid var(--line);border-radius:12px;padding:12px 18px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;font-weight:500}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.ok{border-color:var(--green2)}#toast.err{border-color:var(--red)}
.blk{margin-bottom:38px}
.blk-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.blk-head h2{font-size:30px;font-weight:800;color:var(--gold);flex:0 1 auto}
.blk-head .sp{flex:1}
.blk-head.off h2{color:var(--gray);text-decoration:line-through}
.blk-head.isnew,.blk-head.changed{border-bottom-color:var(--green2)}
.blk-body.dim{opacity:.45}
.pill{font:700 12px 'Barlow';letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--red);color:var(--red)}
.pill.new{border-color:var(--gold);color:var(--gold)}
.sec-head h3{font:700 18px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;color:var(--gray)}
.row .nm{display:flex;gap:10px;align-items:center}
.row .nm>div{min-width:0;flex:1}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:#0e100d}
.newsec{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.sel{width:100%;background:#0e100d;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--white)}
.demo{background:#3a2e10;color:var(--gold2);text-align:center;padding:6px;font-size:13px}
</style>
</head>
<body>
<!--DEMO_BANNER-->
<div id="login">
  <div class="lcard" id="lcard">
    <img src="../images/logo/monobolon.png" alt="MonoBolón">
    <h1>Editor de carta</h1>
    <p>Ingresa tu PIN</p>
    <div class="dots" id="dots"></div>
    <div class="lerr" id="lerr"></div>
    <div class="pad" id="pad"></div>
  </div>
</div>
<div id="app" class="hide">
  <header>
    <div class="hrow">
      <img src="../images/logo/monobolon.png" alt="">
      <h1>Editor de carta</h1>
      <span class="role" id="role"></span>
      <button class="btn sm" id="bHist"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span class="hide-sm">Historial</span></button>
      <button class="btn sm" id="bPin"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span class="hide-sm">Cambiar PIN</span></button>
      <a class="btn sm" id="bView" href="../" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span class="hide-sm">Ver carta</span></a>
      <button class="btn sm" id="bOut">Salir</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>
  <div class="bar"><div class="in"><div class="st" id="st"></div><button class="btn" id="bDiscard">Descartar</button><button class="btn gold" id="bPub"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg><span>Publicar cambios</span></button></div></div>
</div>
<div id="toast"></div>
<div id="modal"></div>
<script src="../menu-schema.js"></script>
<script>
(function(){
'use strict';
const S = window.MENU_SCHEMA;
const DEMO = !!window.MB_DEMO;
const MENU_KEYS = S.menus.map(m=>m.key);

/* ---------- utilidades ---------- */
const $ = (s,el=document)=>el.querySelector(s);
function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(k==='html') el.innerHTML=v;
    else if(k==='value') el.value=v;
    else if(v===true) el.setAttribute(k,'');
    else el.setAttribute(k,v);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false) return; el.append(c.nodeType?c:document.createTextNode(c)); });
  return el;
}
const ICON={
  eye:'<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff:'<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.5 6.6A17 17 0 0 0 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.8-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  pen:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  cam:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  lock:'<svg viewBox="0 0 24 24" style="width:16px;height:16px"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const ico=(n)=>h('span',{html:ICON[n],style:'display:contents'});
function toast(msg,type){const t=$('#toast');t.textContent=msg;t.className='show '+(type||'');clearTimeout(toast._t);toast._t=setTimeout(()=>t.className='',type==='err'?4500:2600);}
const clone=o=>JSON.parse(JSON.stringify(o));
const rand=n=>Array.from({length:n},()=>'abcdefghijkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*32)]).join('');
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,28)||'plato';
const imgSrc=u=>!u?'':(/^(\/|https?:|data:|blob:)/.test(u)?u:(window.MB_IMG_BASE||'../')+u);
const isBi=v=>v&&typeof v==='object'&&!Array.isArray(v)&&'es' in v;
const titleOf=(item,sec)=>{const v=item[sec&&sec.titleKey||'name']||item.name||item.badge;return (isBi(v)?v.es:v)||'(sin nombre)';};
function isSimplePrice(v){return /^\$\d+(\.\d{1,2})?$/.test(String(v||'').trim());}
function normPrice(raw){
  const s=String(raw).trim().replace(',','.').replace(/^\$\s*/,'');
  if(s==='') return '';
  if(/^\d+(\.\d{1,2})?$/.test(s)) return '$'+Number(s).toFixed(2);
  return null;
}

/* ---------- API ---------- */
const store={get(){try{return JSON.parse(localStorage.getItem('mb_admin')||'null');}catch(e){return null;}},set(v){try{v?localStorage.setItem('mb_admin',JSON.stringify(v)):localStorage.removeItem('mb_admin');}catch(e){}}};
let session=store.get();
if(session&&session.exp<Date.now()) session=null;
async function req(path,opt={}){
  if(DEMO) return window.MB_DEMO_API(path,opt,session);
  const headers={...(opt.headers||{})};
  if(session) headers.authorization='Bearer '+session.token;
  if(opt.json) headers['content-type']='application/json';
  const r=await fetch(path,{method:opt.method||'GET',headers,body:opt.json?JSON.stringify(opt.json):opt.body,cache:'no-store'});
  let data=null; try{data=await r.json();}catch(e){}
  if(r.status===401&&session&&path!=='/api/login'){ logout('Tu sesión venció. Ingresa el PIN otra vez.'); throw new Error('sesion'); }
  if(!r.ok) throw new Error((data&&data.error)||('Error '+r.status));
  return data;
}

function flat(node,map=new Map()){
  if(Array.isArray(node)) node.forEach(n=>flat(n,map));
  else if(node&&typeof node==='object'){
    if(node.id){
      const shallow={};
      for(const [k,v] of Object.entries(node)) shallow[k]=Array.isArray(v)?v.map(x=>x&&x.id):v;
      map.set(node.id,JSON.stringify(shallow));
    }
    Object.values(node).forEach(v=>flat(v,map));
    if(node._blocks&&!node.id) Object.entries(node._blocks).forEach(([k,v])=>{ if(v&&(v.hidden||v.title)) map.set('block.'+k,JSON.stringify(v)); });
  }
  return map;
}
let origMaps={};
function snapshotMaps(){origMaps={};MENU_KEYS.forEach(k=>origMaps[k]=flat(orig[k]));}
function diffs(){
  const res={total:0,byMenu:{},added:new Set(),changed:new Set()};
  MENU_KEYS.forEach(k=>{
    const cur=flat(data[k]),o=origMaps[k];let n=0;
    cur.forEach((v,id)=>{ if(!o.has(id)){n++;res.added.add(id);} else if(o.get(id)!==v){n++;res.changed.add(id);} });
    o.forEach((v,id)=>{ if(!cur.has(id)) n++; });
    res.byMenu[k]=n;res.total+=n;
  });
  return res;
}
function refreshDirty(){
  const d=diffs();
  const st=$('#st');
  st.className='st'+(d.total?'':' clean');
  st.replaceChildren(...(d.total?[h('b',{},d.total+(d.total===1?' cambio':' cambios')),' sin publicar']:[h('b',{},'Todo publicado'),' · lo que ves aquí es lo que ven tus clientes']));
  $('#bPub').disabled=!d.total; $('#bDiscard').disabled=!d.total;
  document.querySelectorAll('[data-id]').forEach(el=>{
    el.classList.toggle('isnew',d.added.has(el.dataset.id));
    el.classList.toggle('changed',!d.added.has(el.dataset.id)&&d.changed.has(el.dataset.id));
  });
  document.querySelectorAll('.tab').forEach(t=>{const dot=t.querySelector('.dot');const has=d.byMenu[t.dataset.k]>0;if(has&&!dot)t.append(h('i',{class:'dot'}));if(!has&&dot)dot.remove();});
  return d;
}

function priceSummary(item,sec){

  if(f('price')) return item.price;
  if(f('entero')||f('media')) return [f('entero')?item.entero:'',f('media')?'½ '+item.media:''].filter(Boolean).join(' · ');
  const lf=(sec.fields||[]).find(x=>x.kind==='list');
  if(lf&&item[lf.key]&&item[lf.key].length){
    const nums=item[lf.key].map(x=>parseFloat(String(x.price||'').replace('$',''))).filter(n=>!isNaN(n));

  }

function askRemove(list,item,sec){
  confirmBox('¿Quitar «'+titleOf(item,sec)+'» de la carta?','Desaparece de la carta al publicar. Si te equivocas, puedes recuperarlo desde el Historial.','Quitar',()=>{
    const i=list.indexOf(item);if(i>=0)list.splice(i,1);render();toast('Quitado. Pulsa Publicar para confirmar.');
  });
}

/* ---------- ventanas ---------- */
function closeModal(){$('#modal').replaceChildren();}
function scrim(content,onClose){
  const s=h('div',{class:'scrim',onmousedown:e=>{if(e.target===s){closeModal();onClose&&onClose();}}},content);
  $('#modal').replaceChildren(s);return s;
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
function confirmBox(title,msg,okLabel,onOk){
  const box=h('div',{class:'sheet',style:'max-width:420px;border-radius:20px'},
    h('div',{class:'sb'},h('h3',{style:'font-size:24px'},title),h('p',{style:'color:var(--gray)'},msg)),
    h('div',{class:'sf'},h('span',{class:'sp'}),h('button',{class:'btn',onclick:closeModal},'Cancelar'),h('button',{class:'btn danger',onclick:()=>{closeModal();onOk();}},okLabel)));
  const s=scrim(box);s.style.alignItems='center';s.style.zIndex=70;
}

/* ---------- fotos ---------- */
function loadBitmap(file){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('No se pudo leer la imagen'));im.src=u;});
}
async function prepareImage(file){
  const im=await loadBitmap(file);const max=1400;let w=im.naturalWidth,hh=im.naturalHeight;
  const k=Math.min(1,max/Math.max(w,hh));w=Math.round(w*k);hh=Math.round(hh*k);
  const c=document.createElement('canvas');c.width=w;c.height=hh;const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,w,hh);x.drawImage(im,0,0,w,hh);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('No se pudo procesar la imagen')),'image/jpeg',.86));
}
async function uploadFile(file){
  if(!/^image\//.test(file.type)&&!/\.(jpe?g|png|webp|heic)$/i.test(file.name)) throw new Error('Elige una imagen (JPG, PNG o WebP)');
  const blob=await prepareImage(file);
  const r=await req('/api/upload',{method:'POST',body:blob,headers:{'content-type':'image/jpeg'}});
  return r.url;
}
function pickPhoto(cb,setBusy){
  const f=h('input',{type:'file',accept:'image/*',style:'display:none'});
  f.addEventListener('change',async()=>{
    if(!f.files[0]) return;
    try{setBusy&&setBusy(true);const url=await uploadFile(f.files[0]);cb(url);toast('Foto lista','ok');}
    catch(e){toast(e.message,'err');}finally{setBusy&&setBusy(false);}
  });
  document.body.append(f);f.click();setTimeout(()=>f.remove(),60000);
}

/* ---------- editor de plato ---------- */
function openEditor(o){
  const {sec,fields,list,prefix,isNew}=o;
  const owner=isOwner();
  const item=isNew?blankItem(fields,prefix):o.item;
  const body=h('div',{class:'sb'});
  const title=o.title||(isNew?'Nuevo plato':'Editar plato');
  const locked=!owner;
  fields.forEach(f=>{
    if(f.kind==='bi') body.append(biField(item,f,locked));
    else if(f.kind==='str') body.append(strField(item,f));
    else if(f.kind==='img') body.append(imgField(item,f));
    else if(f.kind==='list') body.append(nestedEditor(item,f,locked));
  });
  if(!isNew){
    const sw=h('div',{class:'sw'+(item.hidden?' on':''),onclick:()=>{item.hidden=!item.hidden;if(!item.hidden)delete item.hidden;sw.classList.toggle('on',!!item.hidden);}},
      h('div',{class:'tg'}),h('div',{},h('b',{},'Ocultar de la carta'),h('small',{},'Úsalo cuando se agote. Se vuelve a mostrar apagando este botón.')));
    body.append(sw);
  }
  const done=()=>{closeModal();render();};
  const foot=h('div',{class:'sf'});
  if(isNew){
    foot.append(h('span',{class:'sp'}),h('button',{class:'btn',onclick:closeModal},'Cancelar'),
      h('button',{class:'btn gold',onclick:()=>{
        const t=item[sec.titleKey||'name'];const nm=isBi(t)?t.es:t;
        if(!String(nm||'').trim()){toast('Escribe el nombre en español','err');return;}
        item.id=prefix+slug(nm)+'-'+rand(4);
        fixNestedIds(item,fields);
        list.push(item);closeModal();render();toast('Agregado. Pulsa Publicar para que se vea en la carta.','ok');
      }},ico('plus'),'Agregar a la carta'));
  }else{
    if(owner) foot.append(h('button',{class:'btn danger',onclick:()=>{closeModal();askRemove(list,item,sec);}},ico('trash'),'Quitar'));
    foot.append(h('span',{class:'sp'}),h('button',{class:'btn gold',onclick:done},'Listo'));
  }
  const sheet=h('div',{class:'sheet'},h('div',{class:'sh'},h('h3',{},title),h('button',{class:'ibtn',onclick:()=>{isNew?closeModal():done();},'aria-label':'Cerrar'},ico('x'))),body,foot);
  scrim(sheet,()=>{if(!isNew)render();});
}
function fixNestedIds(item,fields){
  fields.filter(f=>f.kind==='list').forEach(f=>(item[f.key]||[]).forEach(n=>{ if(!n.id||n.id.indexOf(item.id)!==0) n.id=item.id+f.suffix+rand(5); }));
}
function blankItem(fields,prefix){
  const it={id:prefix+'tmp-'+rand(4)};
  fields.forEach(f=>{
    if(f.kind==='bi') it[f.key]={es:'',en:''};
    else if(f.kind==='str') it[f.key]='';
    else if(f.kind==='img') it[f.key]='';
    else if(f.kind==='list') it[f.key]=[];
  });
  return it;
}
const LONG=new Set(['desc','sub','ings']);
const PH={name:'Ej.: Jugo de sandía',desc:'Describe el plato en una o dos frases',upsell:'Ej.: Agrega Salsa 4 Quesos por $3.45',ings:'Ej.: Ron blanco, Hierbabuena, Lima, Soda',footer:'Ej.: Textura suave',badge:'Ej.: CAZUELA',sub:'Ej.: Con arroz y maduro'};
function biField(item,f,locked){
  const v=item[f.key]=item[f.key]&&typeof item[f.key]==='object'?item[f.key]:{es:'',en:''};
  const mk=l=>{const el=h(LONG.has(f.key)?'textarea':'input',{class:'inp',placeholder:PH[f.key]||'',disabled:locked});
    el.value=v[l]||'';
    el.addEventListener('input',()=>{v[l]=el.value;refreshDirty();});return el;};
  const es=mk('es'),en=mk('en');
  const copy=h('a',{onclick:()=>{if(!locked){en.value=es.value;v.en=es.value;refreshDirty();}}},'copiar del español');
  const wrap=h('div',{class:'fld'},h('div',{class:'lb'},f.label+(f.optional||f.key==='upsell'?' (opcional)':'')),
    h('div',{class:'two'},h('div',{},h('div',{class:'tag'},'ESPAÑOL'),es),h('div',{},h('div',{class:'tag'},h('span',{},'ENGLISH'),locked?null:copy),en)));
  if(locked) wrap.append(h('div',{class:'lock',html:ICON.lock+' <span>Solo el dueño puede cambiar textos</span>'}));
  if(f.key==='ings') wrap.append(h('div',{class:'hint'},'Sepáralos con comas. Se muestran como etiquetas en la carta.'));
  return wrap;
}
function strField(item,f){
  const wrap=h('div',{class:'fld'},h('div',{class:'lb'},f.label));
  wrap.append(priceInput(item,f.key));
  return wrap;
}
function imgField(item,f){
  const pv=h('div',{class:'pv'});
  const draw=()=>{pv.replaceChildren(item[f.key]?h('img',{src:imgSrc(item[f.key]),alt:''}):h('span',{},'Arrastra una foto aquí o usa el botón'));};
  const setBusy=b=>{const s=pv.querySelector('.spin');if(b&&!s)pv.append(h('div',{class:'spin'},'Subiendo…'));if(!b&&s)s.remove();};
  draw();
  const pb=h('div',{class:'pb'});
  const set=url=>{item[f.key]=url;draw();refreshDirty();paint();};
  const paint=()=>{pb.replaceChildren(h('button',{class:'btn gold',onclick:()=>pickPhoto(set,setBusy)},ico('cam'),item[f.key]?'Cambiar foto':'Subir foto'),
    item[f.key]?h('button',{class:'btn sm danger',onclick:()=>set('')},'Quitar foto'):null,
    h('small',{style:'color:var(--gray)'},'Desde el celular puedes tomarla en el momento.'));};
  paint();
  pv.addEventListener('dragover',e=>{e.preventDefault();pv.classList.add('drag');});
  pv.addEventListener('dragleave',()=>pv.classList.remove('drag'));
  pv.addEventListener('drop',async e=>{e.preventDefault();pv.classList.remove('drag');const file=e.dataTransfer.files[0];if(!file)return;
    try{setBusy(true);set(await uploadFile(file));toast('Foto lista','ok');}catch(er){toast(er.message,'err');}finally{setBusy(false);}});
  return h('div',{class:'fld'},h('div',{class:'lb'},f.label),h('div',{class:'pic'},pv,pb));
}
function nestedEditor(item,f,locked){
  const list=item[f.key]=item[f.key]||[];
  const wrap=h('div',{class:'fld'},h('div',{class:'lb'},f.label));
  const box=h('div',{});
  const draw=()=>{
    box.replaceChildren();
    list.forEach((n,i)=>{
      const nm=n.name=n.name||{es:'',en:''};
      const es=h('input',{class:'inp',placeholder:'Opción (español)',disabled:locked});es.value=nm.es||'';
      const en=h('input',{class:'inp en',placeholder:'Option (English)',disabled:locked});en.value=nm.en||'';
      es.addEventListener('input',()=>{nm.es=es.value;refreshDirty();});en.addEventListener('input',()=>{nm.en=en.value;refreshDirty();});
      const row=h('div',{class:'mini'},es,en,priceInput(n,'price'));
      if(!locked) row.append(h('button',{class:'ibtn danger','aria-label':'Quitar',onclick:()=>{list.splice(i,1);draw();refreshDirty();}},ico('trash')));
      box.append(row);
    });
    if(!list.length) box.append(h('p',{style:'color:var(--gray);font-size:14px'},'Sin opciones todavía.'));
  };
  draw();wrap.append(box);
  if(!locked) wrap.append(h('button',{class:'btn sm green',onclick:()=>{list.push({id:(item.id||'tmp')+f.suffix+rand(5),name:{es:'',en:''},price:''});draw();}},ico('plus'),'Agregar opción'));
  return wrap;
}

/* ---------- publicar / descartar / historial ---------- */
$('#bPub').addEventListener('click',async()=>{
  const d=diffs();if(!d.total)return;
  const b=$('#bPub'),lab=b.querySelector('span');b.disabled=true;lab.textContent='Publicando…';
  try{
    const r=await req('/api/menu',{method:'PUT',json:{menu:data}});
    data=normalizeData(r.menu||data);orig=clone(data);snapshotMaps();render();
    toast('Publicado ✓  Ya se ve en la carta','ok');
  }catch(e){ if(e.message!=='sesion') toast(e.message||'No se pudo publicar','err'); }
  finally{lab.textContent='Publicar cambios';refreshDirty();}
});
$('#bDiscard').addEventListener('click',()=>confirmBox('¿Descartar los cambios?','Se pierden todos los cambios que no has publicado.','Descartar',()=>{data=normalizeData(clone(orig));render();toast('Cambios descartados');}));
$('#bOut').addEventListener('click',()=>{ if(data&&diffs().total&&!confirm('Tienes cambios sin publicar. ¿Salir de todos modos?')) return; logout(''); });
$('#bHist').addEventListener('click',async()=>{
  const body=h('div',{class:'sb'},h('p',{style:'color:var(--gray)'},'Cargando…'));
  const sheet=h('div',{class:'sheet'},h('div',{class:'sh'},h('h3',{},'Versiones anteriores'),h('button',{class:'ibtn',onclick:closeModal,'aria-label':'Cerrar'},ico('x'))),body);
  scrim(sheet);
  try{
    const r=await req('/api/history');
    body.replaceChildren();
    if(!r.items.length) body.append(h('p',{style:'color:var(--gray)'},'Todavía no hay versiones anteriores. Aparecen cada vez que publicas.'));
    r.items.forEach(it=>{
      const dt=new Date(it.v);
      body.append(h('div',{class:'hist'},h('div',{},h('b',{},dt.toLocaleDateString('es',{day:'numeric',month:'long'})+' · '+dt.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})),h('small',{},'Publicado por '+(it.by==='owner'?'el dueño':'el equipo'))),
        h('button',{class:'btn sm',onclick:()=>confirmBox('¿Volver a esta versión?','La carta vuelve a como estaba en ese momento. La versión actual queda guardada en el historial.','Restaurar',async()=>{
          try{const rr=await req('/api/restore',{method:'POST',json:{key:it.key}});data=normalizeData(rr.menu);orig=clone(data);snapshotMaps();render();toast('Versión restaurada','ok');}catch(e){toast(e.message,'err');}
        })},'Restaurar')));
    });
  }catch(e){body.replaceChildren(h('p',{style:'color:var(--red)'},e.message));}
});

$('#bPin').addEventListener('click',()=>{
  const mk=ph=>h('input',{class:'inp',type:'password',inputmode:'numeric',maxlength:'8',autocomplete:'off',placeholder:ph});
  const cur=mk('PIN actual'),n1=mk('PIN nuevo (4 a 8 números)'),n2=mk('Repite el PIN nuevo');
  const body=h('div',{class:'sb'},
    h('div',{class:'fld'},h('div',{class:'lb'},'PIN actual'),cur),
    h('div',{class:'fld'},h('div',{class:'lb'},'PIN nuevo'),n1),
    h('div',{class:'fld'},h('div',{class:'lb'},'Repite el PIN nuevo'),n2,h('div',{class:'hint'},'Es el PIN del dueño. El del equipo no cambia.')));
  const save=async()=>{
    if(!/^\d{4,8}$/.test(n1.value)){toast('El PIN nuevo debe tener de 4 a 8 números','err');return;}
    if(n1.value!==n2.value){toast('Los PIN nuevos no coinciden','err');return;}
    try{
      const r=await req('/api/change-pin',{method:'POST',json:{current:cur.value,newPin:n1.value}});
      session={token:r.token,role:r.role,exp:r.exp};store.set(session);closeModal();toast('PIN cambiado. Úsalo la próxima vez que entres.','ok');
    }catch(e){ if(e.message!=='sesion') toast(e.message,'err'); }
  };
  scrim(h('div',{class:'sheet',style:'max-width:440px'},h('div',{class:'sh'},h('h3',{},'Cambiar PIN del dueño'),h('button',{class:'ibtn',onclick:closeModal,'aria-label':'Cerrar'},ico('x'))),body,
    h('div',{class:'sf'},h('span',{class:'sp'}),h('button',{class:'btn',onclick:closeModal},'Cancelar'),h('button',{class:'btn gold',onclick:save},'Guardar PIN'))));
  setTimeout(()=>cur.focus(),50);
});

/* ---------- arranque ---------- */
buildPad();
if(session){ enter(); }
window.__MB={S,get data(){return data;},get session(){return session;}};
})();
